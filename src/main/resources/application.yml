spring:
  application:
    name: run-agent
  ai:
    tools:
      limits:
        max-calls-per-tool-default: ${AGENT_MAX_CALLS_PER_TOOL:4}
        max-total-tool-calls: ${AGENT_MAX_TOTAL_TOOL_CALLS:8}
        on-limit-exceeded: THROW
    openai:
      api-key: ${AI_GATEWAY_API_KEY:${spring.ai.deepseek.api-key:${DEEPSEEK_API_KEY:}}}
      base-url: ${AI_GATEWAY_BASE_URL:${spring.ai.deepseek.base-url:${DEEPSEEK_BASE_URL:https://api.deepseek.com}}}
      chat:
        model: ${AI_GATEWAY_MODEL:${spring.ai.deepseek.chat.model:${DEEPSEEK_MODEL:deepseek-v4-pro}}}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

run-agent:
  agent:
    timeout: ${AGENT_TIMEOUT:30s}
  memory:
    max-messages: ${AGENT_MEMORY_MAX_MESSAGES:20}
  running-data:
    # 不配置时保持空值；只有模型请求 Running Tool 时才尝试读取文件。
    path: ${RUNNING_DATA_PATH:}

logging:
  level:
    cn.watsonzhu.runagent: INFO
