spring:
  application:
    name: run-agent
  ai:
    tools:
      limits:
        max-calls-per-tool-default: ${AGENT_MAX_CALLS_PER_TOOL:4}
        max-total-tool-calls: ${AGENT_MAX_TOTAL_TOOL_CALLS:8}
        on-limit-exceeded: THROW
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-v4-pro}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

run-agent:
  agent:
    timeout: ${AGENT_TIMEOUT:30s}
  running-data:
    # 不配置时保持空值；只有模型请求 Running Tool 时才尝试读取文件。
    path: ${RUNNING_DATA_PATH:}

logging:
  level:
    cn.watsonzhu.runagent: INFO
