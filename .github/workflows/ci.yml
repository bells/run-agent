name: RunAgent CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --no-daemon build
      - name: Test Python data and content pipelines
        run: python3 -m unittest discover -s scripts
      - name: Test release packaging and rollback
        run: |
          bash deploy/test/bundle-test.sh
          bash deploy/test/release-test.sh
          bash deploy/test/snapshot-test.sh
          python3 deploy/test/marathon-sub3-refresh-test.py
