name: Production smoke

on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-entrypoints:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Frontend and API access
        env:
          RUN_AGENT_PUBLIC_API_ENABLED: ${{ vars.RUN_AGENT_PUBLIC_API_ENABLED || 'false' }}
        run: bash deploy/smoke-public.sh
