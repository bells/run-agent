plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cn.watsonzhu'
version = '0.12.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', '2.0.1')
}

dependencyManagement {
    imports {
        // 统一 Spring AI 模块版本，避免模型 Starter 与 ChatClient 使用不同的 API 版本。
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-client-webflux'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    implementation 'org.springframework.ai:spring-ai-vector-store-advisor'
    implementation 'org.springframework.ai:spring-ai-autoconfigure-vector-store-observation'
    implementation 'org.springframework.ai:spring-ai-tika-document-reader'
    implementation 'org.bsc.langgraph4j:langgraph4j-core:1.8.27'
    implementation 'io.github.resilience4j:resilience4j-retry:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-bulkhead:2.4.0'
    implementation('io.github.resilience4j:resilience4j-micrometer:2.4.0') {
        exclude group: 'io.github.resilience4j', module: 'resilience4j-timelimiter'
        exclude group: 'io.github.resilience4j', module: 'resilience4j-ratelimiter'
    }


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'io.micrometer:micrometer-observation-test'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
}

tasks.named('test') {
    useJUnitPlatform()
}


tasks.register('evaluation', JavaExec) {
    group = 'verification'
    description = 'Run synthetic offline evaluation and write quality reports (not part of build).'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'logback.configurationFile', file('src/test/resources/logback-evaluation.xml').absolutePath
    mainClass = 'cn.watsonzhu.runagent.evaluation.EvaluationRunner'
    args layout.buildDirectory.dir('reports/run-agent-evaluation').get().asFile.absolutePath, project.version.toString()
    systemProperties System.properties.findAll { key, value -> key.toString().startsWith('evaluation.threshold.') }
}

tasks.register('liveEvaluation', JavaExec) {
    group = 'verification'
    description = 'Opt-in real model evaluation with synthetic tools; report only (not part of build).'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'logback.configurationFile', file('src/test/resources/logback-evaluation.xml').absolutePath
    mainClass = 'cn.watsonzhu.runagent.evaluation.LiveEvaluationRunner'
    args layout.buildDirectory.dir('reports/run-agent-evaluation/live').get().asFile.absolutePath, project.version.toString()
}

// Independent test-source runners. Neither task is a dependency of test/check/build.
['performanceBenchmark': false, 'livePerformanceBenchmark': true].each { taskName, live ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = live ? 'Opt-in live models with synthetic dependencies only.' : 'Offline synthetic performance governance contract.'
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        systemProperty 'logback.configurationFile', file('src/test/resources/logback-evaluation.xml').absolutePath
        mainClass = 'cn.watsonzhu.runagent.performance.PerformanceBenchmark'
        args layout.buildDirectory.dir(live ? 'reports/run-agent-performance/live' : 'reports/run-agent-performance').get().asFile.absolutePath,
                project.version.toString(), live ? 'live' : 'offline'
    }
}

tasks.register('reliabilityVerification', JavaExec) {
    group = 'verification'
    description = 'Offline deterministic reliability, budget, degradation and checkpoint contracts (not part of build).'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'logback.configurationFile', file('src/test/resources/logback-evaluation.xml').absolutePath
    mainClass = 'cn.watsonzhu.runagent.reliability.ReliabilityVerification'
    args layout.buildDirectory.dir('reports/run-agent-reliability').get().asFile.absolutePath, project.version.toString()
}
