services:
  run-agent:
    network_mode: host
    ports: !reset []
    volumes: !override
      - run-reviews:/var/lib/run-agent/reviews
      - run-conversations:/var/lib/run-agent/conversations
      - run-marathon-podiums:/var/lib/run-agent/marathon-podiums
      - type: bind
        source: ${RUN_AGENT_MARATHON_DATA_DIR:-./marathon-data}
        target: /marathon-data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RUN_AGENT_KNOWLEDGE_DIR:-./knowledge}
        target: /knowledge
        read_only: true
        bind:
          create_host_path: false
    environment:
      SPRING_PROFILES_ACTIVE: ${RUN_AGENT_MCP_PROFILES:-mcp}
      SERVER_ADDRESS: "127.0.0.1"
      SERVER_PORT: "18080"
      RUNNING_TOOL_PROVIDER: mcp
      RUN_AGENT_PRIVATE_TRAINING_ENABLED: "true"
      RUN_AGENT_LEGACY_API_ENABLED: "false"
      RUN_AGENT_RUN_REVIEW_DIR: /var/lib/run-agent/reviews
      RUNNING_MCP_URL: http://127.0.0.1:8090
      RAG_VECTOR_STORE_PATH: /knowledge/vector-store.json
      RAG_REINDEX: "false"
    depends_on:
      running-mcp:
        condition: service_healthy
  running-mcp:
    image: ${RUN_AGENT_MCP_IMAGE:?Set the MCP release image}
    pull_policy: never
    network_mode: host
    restart: unless-stopped
    mem_limit: 384m
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      RUNNING_MCP_BIND_ADDRESS: "127.0.0.1"
      RUNNING_MCP_PORT: "8090"
      RUNNING_DATA_PATH: /data/activities.json
      RUNNING_PUBLIC_DATA_PATH: /public-data/activities.json
    volumes:
      - type: bind
        source: ${RUN_AGENT_DATA_DIR:?Set the activity export directory}
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RUN_AGENT_PUBLIC_DATA_DIR:-./public-data}
        target: /public-data
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090"]
      start_period: 15s
      interval: 4s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  run-reviews:
