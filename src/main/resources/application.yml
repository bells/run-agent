spring:
  application:
    name: run-agent
  ai:
    model:
      chat: openai
      embedding: ollama
    ollama:
      base-url: ${RAG_OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      embedding:
        model: ${RAG_EMBEDDING_MODEL:bge-m3}
    tools:
      limits:
        max-calls-per-tool-default: ${AGENT_MAX_CALLS_PER_TOOL:4}
        max-total-tool-calls: ${AGENT_MAX_TOTAL_TOOL_CALLS:8}
        on-limit-exceeded: THROW
    openai:
      api-key: ${AI_GATEWAY_API_KEY:${spring.ai.deepseek.api-key:${DEEPSEEK_API_KEY:}}}
      base-url: ${AI_GATEWAY_BASE_URL:${spring.ai.deepseek.base-url:${DEEPSEEK_BASE_URL:https://api.deepseek.com}}}
      chat:
        model: ${AI_GATEWAY_MODEL:${spring.ai.deepseek.chat.model:${DEEPSEEK_MODEL:deepseek-v4-pro}}}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

run-agent:
  rag:
    enabled: ${RAG_ENABLED:false}
    source-path: ${RAG_SOURCE_PATH:}
    vector-store-path: ${RAG_VECTOR_STORE_PATH:.run-agent/rag/vector-store.json}
    reindex: ${RAG_REINDEX:false}
    chunk-size: ${RAG_CHUNK_SIZE:800}
    min-chunk-size-chars: ${RAG_MIN_CHUNK_SIZE_CHARS:350}
    min-chunk-length-to-embed: ${RAG_MIN_CHUNK_LENGTH_TO_EMBED:10}
    max-num-chunks: ${RAG_MAX_NUM_CHUNKS:5000}
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.5}
    timeout: ${RAG_TIMEOUT:180s}
  agent:
    timeout: ${AGENT_TIMEOUT:30s}
  memory:
    max-messages: ${AGENT_MEMORY_MAX_MESSAGES:20}
  running-data:
    # 不配置时保持空值；只有模型请求 Running Tool 时才尝试读取文件。
    path: ${RUNNING_DATA_PATH:}

logging:
  level:
    cn.watsonzhu.runagent: INFO
    # SimpleVectorStore's default logs include file paths; provider errors may include source data.
    org.springframework.ai.vectorstore.SimpleVectorStore: OFF
    org.springframework.ai.ollama: OFF
    org.apache.tika: OFF
