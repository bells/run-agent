spring:
  application:
    name: run-agent
  reactor:
    context-propagation: auto
  ai:
    chat:
      client:
        observations:
          log-prompt: false
          log-completion: false
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: false
    vectorstore:
      observations:
        log-query-response: false
    mcp:
      client:
        enabled: false
        initialized: false
        toolcallback:
          enabled: false
    model:
      chat: openai
      embedding: ollama
    ollama:
      base-url: ${RAG_OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      embedding:
        model: ${RAG_EMBEDDING_MODEL:bge-m3}
    tools:
      observations:
        include-content: false
      limits:
        max-calls-per-tool-default: ${AGENT_MAX_CALLS_PER_TOOL:4}
        max-total-tool-calls: ${AGENT_MAX_TOTAL_TOOL_CALLS:8}
        on-limit-exceeded: THROW
    openai:
      # Keep provider failures bounded; the SDK otherwise retries requests automatically.
      max-retries: 0
      api-key: ${AI_GATEWAY_API_KEY:${spring.ai.deepseek.api-key:${DEEPSEEK_API_KEY:}}}
      base-url: ${AI_GATEWAY_BASE_URL:${spring.ai.deepseek.base-url:${DEEPSEEK_BASE_URL:https://api.deepseek.com}}}
      chat:
        model: ${AI_GATEWAY_MODEL:${spring.ai.deepseek.chat.model:${DEEPSEEK_MODEL:deepseek-v4-pro}}}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

run-agent:
  private-chat:
    enabled: ${RUN_AGENT_PRIVATE_CHAT_ENABLED:false}
    token: ${RUN_AGENT_PRIVATE_CHAT_TOKEN:}
  public-api:
    enabled: ${RUN_AGENT_PUBLIC_API_ENABLED:false}
    chat-daily-limit: ${RUN_AGENT_PUBLIC_CHAT_DAILY_LIMIT:40}
    training-advice-daily-limit: ${RUN_AGENT_PUBLIC_TRAINING_ADVICE_DAILY_LIMIT:12}
    review-ids: ${RUN_AGENT_PUBLIC_REVIEW_IDS:}
    review-daily-limit: ${RUN_AGENT_PUBLIC_REVIEW_DAILY_LIMIT:8}
  legacy-api:
    enabled: ${RUN_AGENT_LEGACY_API_ENABLED:true}
  marathon:
    enabled: ${RUN_AGENT_MARATHON_ENABLED:false}
    snapshot: ${RUN_AGENT_MARATHON_SNAPSHOT:}
    podium-directory: ${RUN_AGENT_MARATHON_PODIUM_DIR:.run-agent/marathon-podiums}
    lookup-enabled: ${RUN_AGENT_MARATHON_LOOKUP_ENABLED:false}
    tavily-api-key: ${RUN_AGENT_MARATHON_TAVILY_API_KEY:}
  run-review:
    enabled: ${RUN_AGENT_RUN_REVIEW_ENABLED:false}
    generation-enabled: ${RUN_AGENT_RUN_REVIEW_GENERATION_ENABLED:false}
    evidence-base-url: ${RUN_AGENT_RUN_REVIEW_EVIDENCE_BASE_URL:}
    directory: ${RUN_AGENT_RUN_REVIEW_DIR:.run-agent/reviews}
    timeout: ${RUN_AGENT_RUN_REVIEW_TIMEOUT:25s}
  private-training:
    enabled: ${RUN_AGENT_PRIVATE_TRAINING_ENABLED:false}
  reliability:
    enabled: ${RELIABILITY_ENABLED:false}
    retry:
      max-attempts: ${RELIABILITY_RETRY_MAX_ATTEMPTS:2}
      initial-delay: ${RELIABILITY_RETRY_INITIAL_DELAY:200ms}
      multiplier: ${RELIABILITY_RETRY_MULTIPLIER:2.0}
      max-delay: ${RELIABILITY_RETRY_MAX_DELAY:1s}
      jitter: ${RELIABILITY_RETRY_JITTER:0.25}
    circuit-breaker:
      sliding-window-size: 10
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-duration-in-open-state: 30s
      permitted-calls-in-half-open-state: 2
    bulkhead:
      llm:
        max-concurrent-calls: ${RELIABILITY_LLM_MAX_CONCURRENT:8}
      running-mcp:
        max-concurrent-calls: ${RELIABILITY_RUNNING_MAX_CONCURRENT:4}
      weather-mcp:
        max-concurrent-calls: ${RELIABILITY_WEATHER_MAX_CONCURRENT:4}
    checkpoint:
      enabled: ${RELIABILITY_CHECKPOINT_ENABLED:false}
  running-tools:
    provider: ${RUNNING_TOOL_PROVIDER:local}
  rag:
    enabled: ${RAG_ENABLED:false}
    source-path: ${RAG_SOURCE_PATH:}
    vector-store-path: ${RAG_VECTOR_STORE_PATH:.run-agent/rag/vector-store.json}
    reindex: ${RAG_REINDEX:false}
    chunk-size: ${RAG_CHUNK_SIZE:800}
    min-chunk-size-chars: ${RAG_MIN_CHUNK_SIZE_CHARS:350}
    min-chunk-length-to-embed: ${RAG_MIN_CHUNK_LENGTH_TO_EMBED:10}
    max-num-chunks: ${RAG_MAX_NUM_CHUNKS:5000}
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.5}
    timeout: ${RAG_TIMEOUT:180s}
  agent:
    timeout: ${AGENT_TIMEOUT:30s}
  workflow:
    timeout: ${WORKFLOW_TIMEOUT:60s}
  performance:
    mode: ${PERFORMANCE_MODE:BASELINE}
    max-model-calls: ${PERFORMANCE_MAX_MODEL_CALLS:16}
    max-output-tokens-per-call: ${PERFORMANCE_MAX_OUTPUT_TOKENS_PER_CALL:1500}
    soft-total-tokens: ${PERFORMANCE_SOFT_TOTAL_TOKENS:30000}
    stage-reasoning-effort:
      knowledge-coach: ${PERFORMANCE_REASONING_EFFORT_KNOWLEDGE_COACH:PROVIDER_DEFAULT}
    models:
      default:
        name: ${spring.ai.openai.chat.model}
      fast:
        name: ${AI_FAST_MODEL:}
      strong:
        name: ${AI_STRONG_MODEL:}
    context:
      routing-report-chars: ${PERFORMANCE_ROUTING_REPORT_CHARS:600}
      knowledge-evidence-chars: ${PERFORMANCE_KNOWLEDGE_EVIDENCE_CHARS:9000}
    stage-output-limits:
      supervisor-route: ${PERFORMANCE_ROUTE_OUTPUT_TOKENS:256}
      running-analyst: ${PERFORMANCE_RUNNING_OUTPUT_TOKENS:800}
      knowledge-coach: ${PERFORMANCE_KNOWLEDGE_OUTPUT_TOKENS:1000}
      weather-advisor: ${PERFORMANCE_WEATHER_OUTPUT_TOKENS:800}
      supervisor-synthesis: ${PERFORMANCE_SYNTHESIS_OUTPUT_TOKENS:1200}
    pricing:
      currency: ${PERFORMANCE_CURRENCY:USD}
      tiers:
        default:
          input-per-million: ${DEFAULT_MODEL_INPUT_PRICE_PER_MILLION:-1}
          output-per-million: ${DEFAULT_MODEL_OUTPUT_PRICE_PER_MILLION:-1}
        fast:
          input-per-million: ${FAST_MODEL_INPUT_PRICE_PER_MILLION:-1}
          output-per-million: ${FAST_MODEL_OUTPUT_PRICE_PER_MILLION:-1}
        strong:
          input-per-million: ${STRONG_MODEL_INPUT_PRICE_PER_MILLION:-1}
          output-per-million: ${STRONG_MODEL_OUTPUT_PRICE_PER_MILLION:-1}
  multi-agent:
    timeout: ${MULTI_AGENT_TIMEOUT:180s}
    max-delegations: ${MULTI_AGENT_MAX_DELEGATIONS:3}
    max-report-chars: ${MULTI_AGENT_MAX_REPORT_CHARS:2500}
    max-task-chars: ${MULTI_AGENT_MAX_TASK_CHARS:2000}
  memory:
    max-messages: ${AGENT_MEMORY_MAX_MESSAGES:20}
  running-data:
    # 不配置时保持空值；只有模型请求 Running Tool 时才尝试读取文件。
    path: ${RUNNING_DATA_PATH:}

logging:
  level:
    cn.watsonzhu.runagent: INFO
    # SimpleVectorStore's default logs include file paths; provider errors may include source data.
    org.springframework.ai.vectorstore.SimpleVectorStore: OFF
    org.springframework.ai.ollama: OFF
    # OpenAiChatModel warns with the complete Prompt when the provider returns no choices.
    org.springframework.ai.openai: OFF
    # Unknown model-supplied tool names can contain copied user/evidence text.
    org.springframework.ai.model.tool.DefaultToolCallingManager: OFF
    org.apache.tika: OFF
    # Official MCP adapter errors can contain full remote payloads.
    org.springframework.ai.mcp: OFF
    io.modelcontextprotocol: OFF
    # Graph internals can log complete state and node updates, including private evidence.
    org.bsc.langgraph4j: OFF

# No authentication is installed: management stays on a separate loopback listener.
management:
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      enabled: false
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  tracing:
    export:
      enabled: false
