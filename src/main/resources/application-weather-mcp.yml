spring:
  ai:
    mcp:
      client:
        enabled: true
        initialized: false
        name: run-agent
        version: 0.6.0
        type: SYNC
        request-timeout: 10s
        toolcallback:
          enabled: false
        streamable-http:
          connections:
            weather:
              # Full URL including /mcp; the environment variable overrides this profile's public default.
              url: ${WEATHER_MCP_URL:https://open-meteo.caseyjhand.com/mcp}
              endpoint: ${WEATHER_MCP_URL:https://open-meteo.caseyjhand.com/mcp}
